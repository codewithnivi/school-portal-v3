{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center">
    <h3>All Students <span class="text-muted" style="font-size:16px;">({{ students|length }} total)</span></h3>
    <a href="/teacher/students/download" class="btn btn-primary">⬇ Download All Student Data (CSV)</a>
</div>
<input type="text" id="searchBox" class="form-control my-3" placeholder="Search by name or class..." onkeyup="filterTable()">
<table class="table table-bordered bg-white" id="studentTable">
    <thead>
        <tr><th>Name</th><th>Roll No</th><th>Class</th><th>Email</th></tr>
    </thead>
    <tbody>
        {% for s in students %}
        <tr>
            <td>{{ s['name'] }}</td>
            <td>{{ s['roll_no'] }}</td>
            <td><span class="badge-class">{{ s['class_name'] }}</span></td>
            <td>{{ s['email'] }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<script>
function filterTable() {
    let input = document.getElementById('searchBox').value.toLowerCase();
    let rows = document.getElementById('studentTable').getElementsByTagName('tr');
    for (let i = 1; i < rows.length; i++) {
        let text = rows[i].innerText.toLowerCase();
        rows[i].style.display = text.includes(input) ? '' : 'none';
    }
}
</script>
{% endblock %}
