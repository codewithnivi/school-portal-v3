<!DOCTYPE html>
<html>
<head>
    <title>School Portal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f172a, #0d9488); }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center" style="height:100vh;">
    <div class="card shadow p-4" style="width: 360px; border-radius: 16px; border:none;">
        <h3 class="text-center mb-1" style="color:#0d9488;">🎓 School Portal</h3>
        <p class="text-center text-muted mb-4">Login to your account</p>
        {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <div class="mt-3 text-center text-muted" style="font-size: 12px; line-height:1.6;">
            Admin: admin@school.com / admin123<br>
            Teacher: teacher1@example.com / teacher123<br>
            Student: student1@example.com / student123
        </div>
    </div>
</body>
</html>
