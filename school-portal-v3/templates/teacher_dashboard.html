{% extends 'base.html' %}
{% block content %}
<h2>Teacher Dashboard</h2>
<p class="text-muted">Manage attendance and assignments for your classes.</p>
<div class="row mt-4">
    <div class="col-md-4">
        <div class="card stat-card p-3">
            <h6 class="text-muted">Total Students (school-wide)</h6>
            <h2 style="color:#0d9488;">{{ total_students }}</h2>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card stat-card p-3">
            <h6 class="text-muted">Assignments You Posted</h6>
            <h2 style="color:#0369a1;">{{ total_assignments }}</h2>
        </div>
    </div>
</div>
<div class="mt-4">
    <a href="/teacher/attendance" class="btn btn-primary me-2">📅 Mark Attendance</a>
    <a href="/teacher/assignments" class="btn btn-outline-primary">📝 Post Assignment</a>
</div>
{% endblock %}
