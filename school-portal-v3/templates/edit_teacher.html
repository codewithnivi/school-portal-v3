{% extends 'base.html' %}
{% block content %}
<h3>Edit Teacher</h3>
<form method="POST" class="card p-4" style="max-width: 400px;">
    <div class="mb-3"><label class="form-label">Name</label><input name="name" class="form-control" value="{{ teacher['name'] }}" required></div>
    <div class="mb-3"><label class="form-label">Subject</label><input name="subject" class="form-control" value="{{ teacher['subject'] }}" required></div>
    <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ teacher['email'] }}" required></div>
    <button class="btn btn-primary w-100">Update</button>
    <a href="/admin/teachers" class="btn btn-link w-100 mt-1">Cancel</a>
</form>
{% endblock %}
