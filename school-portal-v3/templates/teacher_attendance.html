{% extends 'base.html' %}
{% block content %}
<h3>Mark Attendance — {{ today }}</h3>

<form method="GET" class="mb-3" style="max-width:300px;">
    <select name="class_name" class="form-select" onchange="this.form.submit()">
        {% for c in classes %}
        <option value="{{ c }}" {% if c == selected_class %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
    </select>
</form>

<form method="POST">
    <input type="hidden" name="class_name" value="{{ selected_class }}">
    <table class="table table-bordered bg-white">
        <thead>
            <tr><th>Name</th><th>Roll No</th><th>Present</th><th>Absent</th></tr>
        </thead>
        <tbody>
            {% for s in students %}
            <tr>
                <td>{{ s['name'] }}</td>
                <td>{{ s['roll_no'] }}</td>
                <td><input type="radio" name="status_{{ s['id'] }}" value="Present" checked></td>
                <td><input type="radio" name="status_{{ s['id'] }}" value="Absent"></td>
            </tr>
            {% else %}
            <tr><td colspan="4" class="text-center text-muted">No students in this class.</td></tr>
            {% endfor %}
        </tbody>
    </table>
    <button class="btn btn-primary">Save Attendance</button>
</form>
{% endblock %}
