{% extends 'base.html' %}
{% block content %}
<h2>Admin Dashboard</h2>
<p class="text-muted">Overview of your school.</p>
<div class="row mt-4">
    <div class="col-md-4">
        <div class="card stat-card p-3">
            <h6 class="text-muted">Total Students</h6>
            <h2 style="color:#0d9488;">{{ total_students }}</h2>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card stat-card p-3">
            <h6 class="text-muted">Total Teachers</h6>
            <h2 style="color:#0369a1;">{{ total_teachers }}</h2>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card stat-card p-3">
            <h6 class="text-muted">Active Notices</h6>
            <h2 style="color:#d97706;">{{ total_notices }}</h2>
        </div>
    </div>
</div>
{% endblock %}
