{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Students <span class="text-muted" style="font-size:16px;">({{ students|length }} total)</span></h3>
    <a href="/admin/students/add" class="btn btn-primary">+ Add Student</a>
</div>
<input type="text" id="searchBox" class="form-control mb-3" placeholder="Search by name or class..." onkeyup="filterTable()">
<table class="table table-bordered bg-white" id="studentTable">
    <thead>
        <tr><th>Name</th><th>Roll No</th><th>Class</th><th>Email</th><th>Actions</th></tr>
    </thead>
    <tbody>
        {% for s in students %}
        <tr>
            <td>{{ s['name'] }}</td>
            <td>{{ s['roll_no'] }}</td>
            <td><span class="badge-class">{{ s['class_name'] }}</span></td>
            <td>{{ s['email'] }}</td>
            <td>
                <a href="/admin/students/edit/{{ s['id'] }}" class="btn btn-sm btn-warning">Edit</a>
                <a href="/admin/students/delete/{{ s['id'] }}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this student?')">Delete</a>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="5" class="text-center text-muted">No students yet.</td></tr>
        {% endfor %}
    </tbody>
</table>
<script>
function filterTable() {
    let input = document.getElementById('searchBox').value.toLowerCase();
    let rows = document.getElementById('studentTable').getElementsByTagName('tr');
    for (let i = 1; i < rows.length; i++) {
        let text = rows[i].innerText.toLowerCase();
        rows[i].style.display = text.includes(input) ? '' : 'none';
    }
}
</script>
{% endblock %}
